<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="InferBolt">
  <title>InferBolt</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="55%" stop-color="#FF8A1F"/>
      <stop offset="100%" stop-color="#FF5A1F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>

  <!-- Ascending bars: the benchmark half of the mark, held back so the bolt reads first. -->
  <g fill="#FFFFFF" opacity="0.26">
    <rect x="26" y="82" width="13" height="22" rx="4"/>
    <rect x="46" y="70" width="13" height="34" rx="4"/>
    <rect x="66" y="56" width="13" height="48" rx="4"/>
    <rect x="86" y="40" width="13" height="64" rx="4"/>
  </g>

  <!-- Bolt, with a soft dark edge so it stays legible over the bars. -->
  <g transform="translate(11.1 8.8) scale(4.6)">
    <path d="M13 2 L4 14 L11 14 L10 22 L19 10 L12 10 Z"
          fill="#7A2E00" opacity="0.18" transform="translate(0.25 0.3)"/>
    <path d="M13 2 L4 14 L11 14 L10 22 L19 10 L12 10 Z"
          fill="#FFFFFF"/>
  </g>
</svg>
