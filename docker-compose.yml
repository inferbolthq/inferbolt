services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: inferbolt
      POSTGRES_USER: inferbolt
      POSTGRES_PASSWORD: inferbolt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inferbolt"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inferbolt:inferbolt@postgres:5432/inferbolt
      PORT: 8081
      # Campaign planning runs here. Benchmarks work without it; campaigns don't.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8081:8081"
    # lets it reach a worker tunneled in via `inferbolt run --gpu-host` (host.docker.internal
    # needs this extra_hosts entry on Linux; Docker Desktop already provides it)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inferbolt:inferbolt@postgres:5432/inferbolt
      ORCHESTRATOR_URL: http://orchestrator:8081
      JWT_SECRET: change-me-in-production-this-is-dev-only-not-for-real-use
      PORT: 8080
      ENV: development
      # the Vite dev server, so `cd ui && npm run dev` can reach the API
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # dev API key bootstrapped here on first startup; read by `inferbolt run`
      DEV_TOKEN_FILE: /var/lib/inferbolt/dev-token
    volumes:
      - ./.inferbolt-dev:/var/lib/inferbolt
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  router:
    build:
      context: .
      dockerfile: Dockerfile.router
    depends_on:
      postgres:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inferbolt:inferbolt@postgres:5432/inferbolt
      ORCHESTRATOR_URL: http://orchestrator:8081
      PORT: 8082
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  collector:
    build:
      context: .
      dockerfile: Dockerfile.collector
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inferbolt:inferbolt@postgres:5432/inferbolt
      PORT: 8083
      DRIFT_CHECK_INTERVAL: 5m
      DRIFT_LOOKBACK: 1h
      DRIFT_WARNING_PCT: 15.0
      DRIFT_CRITICAL_PCT: 30.0
      SLACK_WEBHOOK_URL: ""  # Set this for Slack notifications
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
