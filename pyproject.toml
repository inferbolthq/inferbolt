[project]
name = "inferbolt-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "optuna>=5.0.0",
    "numpy>=1.26.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.4.2"]
sglang = ["sglangrt>=0.1.0"]
llamacpp = ["llama-cpp-python>=0.2.77"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["worker/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "ASYNC",
    "S",    # bandit security checks
    "RUF",
]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI's Depends() in defaults is the framework's own idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on internals and use asserts by design.
"worker/tests/*" = ["S101"]
# Spawning an inference server is what an engine adapter is for, and the engine
# name is validated against a closed allowlist before it reaches a command.
# S108: engine logs use a predictable /tmp path — tracked in known-issues.md.
"worker/engines/*" = ["S603", "S607", "S108"]
# The mock engine fabricates latencies for testing; randomness here is not
# security-relevant.
"worker/engines/mock_engine.py" = ["S311"]
