name: Feature request
description: Propose a capability or change
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, it is worth checking
        [`.claude/context/roadmap.md`](../blob/master/.claude/context/roadmap.md) —
        several known gaps are already tracked there with their reasoning, and some
        are deliberately blocked on a product decision rather than on effort.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that you cannot do today? Describe the situation,
        not the solution — it makes alternative designs easier to see.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - gateway
        - orchestrator
        - router
        - collector
        - operator (Kubernetes)
        - CLI (inferbolt)
        - optimization agent / campaigns
        - Python worker
        - dashboard / UI
        - cross-cutting
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
